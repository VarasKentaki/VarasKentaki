name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 3 * * *" # una vez al día, 03:00 UTC
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write # necesario para que el bot pueda hacer commit de las tarjetas

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 1 # España: 1 en invierno, 2 en verano
          EXCLUDE: ""
          THEME: "gruvbox" # solo genera este tema; es el más cercano a tu paleta marrón/naranja
